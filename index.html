  <style>
    /* Calendar numerals use the same face as PRICE amounts without changing their size. */
    .booking-calendar-numeral {
      font-family: "Clear Pro Korean", "Clear Pro", "Noto Sans KR", sans-serif !important;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      font-synthesis: none;
    }

    /* Quote calculator price numerals: Clear Pro Korean SemiBold */
    .quote-calculator .quote-number {
      font-family: "Clear Pro Korean", "Clear Pro", "Noto Sans KR", sans-serif !important;
      font-weight: 600 !important;
      font-synthesis: none;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
    }

    html {
      background-color: #080808;
      color: #F5F5F5;
      scroll-behavior: auto;
    }
    body {
      background-color: #080808;
      color: #F5F5F5;

    }
    :lang(ja) body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', 'Noto Sans KR', sans-serif;

    }
    .card-thumb-overlay {

    }

      background:
        radial-gradient(circle at 28% 45%, rgba(8, 8, 8, 0.42) 0%, rgba(8, 8, 8, 0.88) 72%, #080808 100%),

    @keyframes fadeIn {

      :focus-visible{outline:2px solid #B2D24A;outline-offset:3px}

    :root { color-scheme: dark; }
    body.light-theme, html.light-theme { background:#f5f5f0 !important; color:#171812 !important; color-scheme:light; }
    body.light-theme { --dw-bg:#f5f5f0; --dw-surface:#ffffff; --dw-line:#deded5; --dw-ink:#171812; --dw-muted:#66685f; }
    body.light-theme .glass-header { background:rgba(245,245,240,.9); }
    body.light-theme .bg-obsidian, body.light-theme .bg-obsidian\/95 { background-color:#f5f5f0 !important; }
    body.light-theme .bg-surface, body.light-theme .bg-surface\/95 { background-color:#fff !important; }
    body.light-theme .border-line { border-color:#deded5 !important; }

    body.light-theme .text-muted { color:#66685f !important; }
    body.light-theme .text-ink\/75 { color:#292b24 !important; }
    body.light-theme .money-unit { color:inherit; }
    body.light-theme .hero-bg-vignette { background:linear-gradient(90deg,rgba(245,245,240,.94),rgba(245,245,240,.68) 55%,rgba(245,245,240,.3)) !important; }
    body.light-theme footer { background:#f5f5f0 !important; }
    body.light-theme .bg-obsidian\/80, body.light-theme .bg-obsidian\/75 { background-color:rgba(255,255,255,.88) !important; }
    body.light-theme .text-obsidian { color:#171812 !important; }
    body.light-theme .border-white\/10 { border-color:rgba(0,0,0,.12) !important; }
    body.light-theme .selection\:text-obsidian { color:#171812 !important; }
    @media (prefers-reduced-motion:reduce){#back-to-top{transition:none}}

  
    /* HOME featured works: signature stays 16:9; side thumbnails use a taller crop box. */
    /* HOME featured thumbnails: compact 2:1 layout based on the earlier reference version. */
    .home-work-featured-grid{
      display:grid;
      grid-template-columns:minmax(0,2fr) minmax(0,1fr);
      grid-template-rows:minmax(0,1fr);
      gap:6px;
      align-items:stretch;
      min-width:0;
      margin-block:0;
    }
    .home-work-featured-grid > .home-work-large{
      grid-column:1;
      grid-row:1;
      display:block;
      width:100%;
      height:100%;
      min-width:0;
      min-height:0;
      aspect-ratio:16 / 9;
      overflow:hidden;
    }
    .home-work-featured-side{
      grid-column:2;
      grid-row:1;
      display:grid;
      grid-template-columns:minmax(0,1fr);
      grid-template-rows:repeat(2,minmax(0,1fr));
      gap:6px;
      min-width:0;
      min-height:0;
      width:100%;
      height:100%;
    }
    .home-work-tile{
      display:block;
      position:relative;
      width:100%;
      height:100%;
      min-width:0;
      min-height:0;
      aspect-ratio:16 / 9;
      overflow:hidden;
      background:#111;
    }
    .home-work-large img,
    .home-work-featured-side .home-work-tile img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
    }
    @media(max-width:767px){
      .home-work-featured-grid{
        grid-template-columns:minmax(0,1fr);
        grid-template-rows:auto auto;
        gap:8px;
      }
      .home-work-featured-grid > .home-work-large{
        grid-column:1;
        grid-row:1;
        width:100%;
        height:auto;
        aspect-ratio:16 / 9;
      }
      .home-work-featured-side{
        grid-column:1;
        grid-row:2;
        grid-template-columns:repeat(2,minmax(0,1fr));
        grid-template-rows:auto;
        gap:8px;
        height:auto;
      }
      .home-work-featured-side .home-work-tile{
        width:100%;
        height:auto;
        aspect-ratio:16 / 9;
      }
    }
    /* Compact, square-edged numeric steppers for the price calculator. */
    .quote-stepper{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;min-height:50px;background:var(--dw-bg,#080808);border:1px solid var(--dw-line,#333);color:var(--dw-ink,#f5f5f5)}
    .quote-stepper button{height:48px;font-size:22px;font-weight:500;color:var(--dw-ink,#f5f5f5);background:transparent;border:0;cursor:pointer}
    .quote-stepper button:hover{background:rgba(178,210,74,.14);color:#B2D24A}
    .quote-stepper output{text-align:center;font-family:"Clear Pro Korean","Clear Pro","Noto Sans KR",sans-serif;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
    .works-item{min-width:0}
    .works-image{border-radius:0}
    .works-caption{display:block}
    .money-unit{font-size:50%;font-weight:500;letter-spacing:0}
    .quote-number .money-unit{font-size:40%;font-weight:600}
    .quote-number-input{width:100%;min-height:52px;background:var(--dw-bg,#080808);border:1px solid var(--dw-line,#333);color:var(--dw-ink,#f5f5f5);text-align:center;font-family:"Clear Pro Korean","Clear Pro","Noto Sans KR",sans-serif;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;outline:none}
    .quote-number-input:focus{border-color:#B2D24A;box-shadow:0 0 0 1px #B2D24A}
    .quote-number-input::-webkit-inner-spin-button,.quote-number-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    .quote-number-input{appearance:textfield;-moz-appearance:textfield}
    @media(prefers-reduced-motion:reduce){.home-work-tile img{transition:none}}

    /* Studio DW refinement pass */
    .hero-description{color:rgba(245,245,245,.82)}
    body.light-theme .hero-description{color:#292b24 !important}
    .schedule-pill{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border:1px solid rgba(178,210,74,.42);border-radius:999px;background:rgba(178,210,74,.10);color:#B2D24A;font:500 12px 'DM Mono',monospace;letter-spacing:.12em}
    body.light-theme .schedule-pill{background:rgba(178,210,74,.13);color:#647d16;border-color:rgba(112,143,28,.45)}
    .works-type-badge{font-family:'Plus Jakarta Sans','Noto Sans KR',sans-serif;font-weight:700;letter-spacing:.08em}
    .stat-count{font-size:clamp(7rem,14vw,10rem);line-height:.9;letter-spacing:-.07em;background:linear-gradient(115deg,#f4ff9b 0%,#b2d24a 28%,#79c9d8 58%,#a78bfa 78%,#e5ff78 100%);background-size:220% 220%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 12px rgba(178,210,74,.24));animation:stat-gradient-flow 6s ease-in-out infinite}
    .stat-plus{display:inline-block;position:relative;width:.42em;height:.42em;margin-left:.08em;vertical-align:middle}
    .stat-plus:before,.stat-plus:after{content:'';position:absolute;left:0;top:50%;width:100%;height:13%;border-radius:3px;background:linear-gradient(110deg,#d9ff68,#8bd5ff,#c18cff);box-shadow:0 0 7px rgba(178,210,74,.65),0 0 18px rgba(139,213,255,.45);transform:translateY(-50%);animation:plus-neon 2.8s ease-in-out infinite}
    .stat-plus:after{transform:translateY(-50%) rotate(90deg)}
    @keyframes stat-gradient-flow{0%,100%{background-position:0% 50%;filter:drop-shadow(0 0 8px rgba(178,210,74,.18))}50%{background-position:100% 50%;filter:drop-shadow(0 0 18px rgba(139,213,255,.38))}}
    @keyframes plus-neon{0%,100%{opacity:.45;filter:brightness(.8)}50%{opacity:1;filter:brightness(1.5)}}
    .channel-circle{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--dw-bg,#080808);border:1px solid var(--dw-line,#333);color:var(--dw-ink,#f5f5f5);transition:.2s}
    .channel-circle:hover{border-color:#B2D24A;color:#B2D24A;background:rgba(178,210,74,.1)}
    .quote-switch{appearance:none;width:42px;height:24px;border-radius:999px;background:#444;border:1px solid #666;position:relative;cursor:pointer;transition:.2s;flex:0 0 42px}
    .quote-switch:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#eee;transition:.2s}
    .quote-switch:checked{background:#B2D24A;border-color:#B2D24A}
    .quote-switch:checked:before{left:21px;background:#080808}
    .contact-guidelines{width:100%;height:420px;min-height:420px;max-height:420px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}

    .contact-success-modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .contact-success-modal.is-open{display:flex}
    .contact-success-card{width:min(520px,100%);background:var(--dw-surface,#111);border:1px solid rgba(178,210,74,.45);border-radius:22px;padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.45)}
    .contact-success-card h2{font-size:20px;font-weight:700;color:var(--dw-ink,#f5f5f5)}
    .contact-success-card p{margin-top:12px;font-size:14px;line-height:1.8;color:var(--dw-muted,#aaa);white-space:pre-line}
    .contact-faq{margin-top:42px}
    .contact-faq details{border:1px solid var(--dw-line,#333);background:var(--dw-surface,#111);padding:18px 20px}
    .contact-faq summary{cursor:pointer;color:var(--dw-ink,#f5f5f5);font-weight:600}
    .contact-faq details p{margin-top:12px;color:var(--dw-muted,#aaa);font-size:14px;line-height:1.8}
    @media(prefers-reduced-motion:reduce){.stat-plus:before,.stat-plus:after,.stat-count{animation:none}}


    /* Light-theme contrast audit: keep foreground/background pairs readable across custom UI. */
    body.light-theme::before { background:rgba(245,245,240,.96); }

    body.light-theme .text-gray-400,

<body class="min-h-screen flex flex-col selection:bg-lime selection:text-obsidian">
  <a id="skip-link" href="#home" class="skip-link" onclick="event.preventDefault();document.getElementById('app').focus()">Skip to content</a>

  <!-- Sticky Header -->
  <header class="sticky top-0 z-40 glass-header border-b border-line">
    <div class="max-w-[1220px] mx-auto px-5 sm:px-8 h-16 sm:h-20 flex items-center justify-between gap-4">
      <!-- Brand Wordmark (Minimalist standard studio header, lime accent dot only) -->
      <a href="#home" class="inline-flex items-center gap-2.5 group focus:outline-none">
        <img src="https://github.com/studiodwofficial-a11y/StudioDW_Web/blob/main/Text%20Logo.png?raw=true" alt="STUDIO DW" class="h-9 sm:h-[42px] w-auto object-contain" />
      </a>

      <!-- Desktop Navigation -->
      <nav id="desktop-nav" class="hidden md:flex items-center gap-8 text-[13px] font-medium tracking-[0.08em]" aria-label="Primary Navigation"></nav>

      <!-- Right Controls: Language Switcher & Mobile Menu Button -->
      <div class="flex items-center gap-2.5">
        <button id="theme-toggle" type="button" class="inline-flex items-center gap-2 px-3 py-2 rounded-btn bg-surface border border-line text-xs font-semibold text-ink hover:border-lime/50 transition-colors" aria-pressed="false"><span id="theme-toggle-icon" aria-hidden="true">☼</span><span id="theme-toggle-label">화이트모드</span></button>
        <div id="lang-switcher" class="inline-flex items-center bg-surface border border-line rounded-full p-1" role="group" aria-label="Language Selector">
          <button type="button" data-lang="ko" class="px-2.5 py-1 rounded-full text-[11px] font-mono font-medium transition-colors">KR</button>
          <button type="button" data-lang="ja" class="px-2.5 py-1 rounded-full text-[11px] font-mono font-medium transition-colors">JP</button>
          <button type="button" data-lang="en" class="px-2.5 py-1 rounded-full text-[11px] font-mono font-medium transition-colors">EN</button>
        </div>

        <button id="mobile-menu-btn" type="button" class="md:hidden inline-flex items-center justify-center w-10 h-10 rounded-btn bg-surface border border-line text-ink hover:border-lime/50 transition-colors" aria-label="Toggle Menu" aria-expanded="false">
          <svg id="menu-icon-open" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
          <svg id="menu-icon-close" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div id="mobile-nav" class="hidden md:hidden border-t border-line bg-obsidian/95 backdrop-blur-xl px-5 py-4">
      <nav id="mobile-nav-links" class="flex flex-col gap-1.5"></nav>
      <div id="ip-detect-badge-mobile" class="mt-4 pt-3 border-t border-line text-[11px] font-mono text-muted flex items-center justify-between"></div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="app" class="flex-1 w-full"></main>

  <!-- Global Toast / Notification Banner -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden max-w-sm bg-surface border border-lime/50 text-ink px-4 py-3.5 rounded-card shadow-2xl items-center gap-3 text-sm">
    <span class="w-2 h-2 rounded-full bg-lime shrink-0"></span>

    function sortByUpload(list) {
      const rank = p => Number.isFinite(p.uploadOrder) ? p.uploadOrder : (String(p.id || '').includes('-demo-') ? 99999 : 0);
      return list.map((p, i) => ({ p, i })).sort((a, b) => (rank(a.p) - rank(b.p)) || (a.i - b.i)).map(x => x.p);
    }

    function parseVideoEmbed(url) {
      if (!url || typeof url !== 'string') return null;
      const trimmed = url.trim();

      const ytMatch = trimmed.match(
        /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/
      ) || trimmed.match(/^([A-Za-z0-9_-]{11})$/);
      if (ytMatch && ytMatch[1]) {
        return {
          provider: 'YouTube',
          id: ytMatch[1],
          embedUrl: `https://www.youtube-nocookie.com/embed/${ytMatch[1]}?rel=0&modestbranding=1`,
          bgEmbedUrl: `https://www.youtube-nocookie.com/embed/${ytMatch[1]}?autoplay=1&mute=1&controls=0&loop=1&playlist=${ytMatch[1]}&playsinline=1&rel=0&showinfo=0&modestbranding=1`,
          thumbUrl: `https://img.youtube.com/vi/${ytMatch[1]}/maxresdefault.jpg`
        };
      }

      const vimeoMatch = trimmed.match(/vimeo\.com\/(?:video\/)?(\d+)/);
      if (vimeoMatch && vimeoMatch[1]) {
        return {
          provider: 'Vimeo',
          id: vimeoMatch[1],
          embedUrl: `https://player.vimeo.com/video/${vimeoMatch[1]}?title=0&byline=0&portrait=0`,
          bgEmbedUrl: `https://player.vimeo.com/video/${vimeoMatch[1]}?background=1&autoplay=1&loop=1&byline=0&title=0&muted=1`,
          thumbUrl: null
        };
      }

      if (/\.(mp4|webm|ogg)(\?.*)?$/i.test(trimmed)) {
        return {
          provider: 'MP4',
          id: 'direct',
          directUrl: trimmed
        };
      }

      return null;
    }

    let heroAnimFrame = null;
    function startHeroAmbientCanvas() {
      if (heroAnimFrame) cancelAnimationFrame(heroAnimFrame);
      const canvas = document.getElementById('hero-ambient-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = (canvas.width = canvas.parentElement.offsetWidth);
      let h = (canvas.height = canvas.parentElement.offsetHeight);

      const handleResize = () => {
        if (!canvas.parentElement) return;
        w = canvas.width = canvas.parentElement.offsetWidth;
        h = canvas.height = canvas.parentElement.offsetHeight;
      };
      window.addEventListener('resize', handleResize, { once: true });

      const orbs = [
        { x: 0.72, y: 0.35, r: 260, vx: 0.0004, vy: 0.0003, color: 'rgba(178, 210, 74, 0.22)' },
        { x: 0.55, y: 0.65, r: 340, vx: -0.0003, vy: 0.0002, color: 'rgba(120, 145, 55, 0.16)' },
        { x: 0.85, y: 0.7, r: 220, vx: -0.0002, vy: -0.0004, color: 'rgba(220, 235, 175, 0.10)' }
      ];

      let tick = 0;
      function draw() {
        tick += 0.012;
        ctx.clearRect(0, 0, w, h);

        orbs.forEach((o, idx) => {
          const cx = (o.x + Math.sin(tick + idx * 1.7) * 0.08) * w;
          const cy = (o.y + Math.cos(tick * 0.8 + idx) * 0.08) * h;
          const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, o.r);
          grad.addColorStop(0, o.color);
          grad.addColorStop(1, 'rgba(8, 8, 8, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(cx, cy, o.r, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.save();
        ctx.translate(w * 0.72, h * 0.48);
        ctx.rotate(tick * 0.14);
        ctx.strokeStyle = 'rgba(178, 210, 74, 0.16)';
        ctx.lineWidth = 1;
        for (let i = 1; i <= 3; i++) {
          ctx.beginPath();
          ctx.ellipse(0, 0, 130 * i, 68 * i, i * 0.4, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.lineWidth = 1;
        const offset = (tick * 28) % 90;
        for (let x = -h + offset; x < w; x += 90) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + h * 0.45, h);
          ctx.stroke();
        }

        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) heroAnimFrame = requestAnimationFrame(draw);
      }
      draw();
    }

    async function copyTextToClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
      } catch (e) {}
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }

    function renderCalendarWidget(compact = false) {
      const t = I18N[state.lang];
      const year = state.selectedYear;
      const month = state.selectedMonth;
      const firstDay = new Date(year, month - 1, 1).getDay();
      const daysInMonth = new Date(year, month, 0).getDate();

      const monthPrefix = `${year}-${String(month).padStart(2, '0')}`;
      const monthEvents = state.data.calendarEvents.filter(ev =>
        ev.date.startsWith(monthPrefix) || (ev.endDate && ev.endDate.startsWith(monthPrefix))
      );

      const dayNames = state.lang === 'ko'
        ? ['일', '월', '화', '수', '목', '금', '토']
        : state.lang === 'ja'
          ? ['日', '月', '火', '水', '木', '金', '土']
          : ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

      const getDayStatus = (dayNum) => {
        const dStr = `${monthPrefix}-${String(dayNum).padStart(2, '0')}`;
        const matched = monthEvents.find(ev => {
          const end = ev.endDate || ev.date;
          return dStr >= ev.date && dStr <= end;
        });
        return matched ? matched.status : null;
      };

      const cells = [];
      for (let i = 0; i < firstDay; i++) {
        cells.push(`<div class="h-10 sm:h-12 rounded-xl bg-obsidian/40 border border-transparent"></div>`);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${monthPrefix}-${String(d).padStart(2, '0')}`;
        const status = getDayStatus(d);
        const isSelected = state.selectedDateStr === dStr;

        let cellStyle = 'bg-obsidian border-line/70 text-ink/80 hover:border-line';
        let dotHtml = '';
        if (status === 'open') {
          cellStyle = 'bg-lime-dim border-lime/40 text-ink hover:border-lime';
          dotHtml = '<span class="w-1.5 h-1.5 rounded-full bg-lime"></span>';
        } else if (status === 'busy') {
          cellStyle = 'bg-surfaceHover border-amber-400/35 text-ink';
          dotHtml = '<span class="booking-calendar-dot w-1.5 h-1.5 rounded-full bg-amber-400"></span>';
        } else if (status === 'closed') {
          cellStyle = 'bg-obsidian/80 border-line text-muted/50';
          dotHtml = '<span class="w-1.5 h-1.5 rounded-full bg-neutral-600"></span>';
        }

        if (isSelected) {
          cellStyle += ' ring-2 ring-lime';
        }

        cells.push(`
          <button type="button" data-cal-day="${dStr}" data-cal-status="${status || 'none'}" class="booking-calendar-day h-10 sm:h-12 rounded-xl border flex flex-col items-center justify-center gap-1 transition-all ${cellStyle}">
            <span class="text-xs font-mono booking-calendar-numeral">${d}</span>
            ${dotHtml}
          </button>
        `);
      }

      const displayedEvents = state.selectedDateStr
        ? monthEvents.filter(ev => {
            const end = ev.endDate || ev.date;
            return state.selectedDateStr >= ev.date && state.selectedDateStr <= end;
          })
        : monthEvents;

      const finalEventsList = displayedEvents.length ? displayedEvents : monthEvents;

      return `
        <div class="rounded-panel bg-surface border border-line p-5 sm:p-8">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-line">
            <div class="flex items-center gap-3">
              <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-lime-dim border border-lime-border text-[11px] font-mono text-lime">
                <span class="w-1.5 h-1.5 rounded-full bg-lime animate-pulse"></span>
                <span>${esc(t.schedule.syncBadge)}</span>
              </span>
            </div>

            <div class="flex flex-wrap items-center gap-4 text-[11px] font-mono text-muted">
              <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-lime"></span>${esc(t.schedule.statusLabels.open)}</span>
              <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-400"></span>${esc(t.schedule.statusLabels.busy)}</span>
              <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-neutral-600"></span>${esc(t.schedule.statusLabels.closed)}</span>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 pt-6">
            <div class="lg:col-span-6">
              <div class="flex items-center justify-between mb-4">
                <div class="text-lg sm:text-xl font-bold font-mono text-ink booking-calendar-numeral">
                  ${year}.${String(month).padStart(2, '0')}
                </div>
                <div class="flex items-center gap-1.5">
                  ${state.selectedDateStr ? `
                    <button type="button" id="cal-clear-date" class="px-2.5 py-1.5 rounded-btn bg-obsidian border border-line text-[11px] font-mono text-lime mr-1">
                      ALL
                    </button>
                  ` : ''}
                  <button type="button" id="cal-prev-month" class="w-9 h-9 rounded-btn bg-obsidian border border-line hover:border-lime/50 flex items-center justify-center text-ink" aria-label="Previous Month">
                    ←
                  </button>
                  <button type="button" id="cal-next-month" class="w-9 h-9 rounded-btn bg-obsidian border border-line hover:border-lime/50 flex items-center justify-center text-ink" aria-label="Next Month">
                    →
                  </button>
                </div>
              </div>

              <div class="grid grid-cols-7 gap-1.5 text-center mb-2">
                ${dayNames.map(d => `<div class="text-[10px] font-mono text-muted py-1">${d}</div>`).join('')}
              </div>
              <div class="grid grid-cols-7 gap-1.5">
                ${cells.join('')}
              </div>
            </div>

            <div class="lg:col-span-6 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-4">
                  <h3 class="text-xs font-mono tracking-wider text-muted uppercase">${esc(t.schedule.upcomingTitle)}</h3>
                  
                </div>

                ${finalEventsList.length ? `

                      const badgeClass = ev.status === 'open'
                        ? 'bg-lime-dim text-lime border-lime-border'

                      return `
                        <div class="rounded-card bg-obsidian border border-line p-4 sm:p-5">
                          <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                            <span class="schedule-status-badge ${ev.status === 'busy' ? 'schedule-status-busy' : ''} px-2.5 py-0.5 rounded-full text-[10px] font-mono border ${badgeClass}">
                              ${esc(t.schedule.statusLabels[ev.status] || ev.status.toUpperCase())}
                            </span>
                            <span class="text-xs font-mono text-muted booking-calendar-numeral">
                              ${esc(ev.date)}${ev.endDate && ev.endDate !== ev.date ? ` ~ ${esc(ev.endDate)}` : ''}

                        </div>
                      `;
                    }).join('')}
                  </div>
                ` : `
                  <div class="rounded-card bg-obsidian border border-line p-8 text-center text-xs text-muted">
                    ${esc(t.schedule.noEvents)}
                  </div>
                `}
              </div>

              ${!compact ? `

                  <a href="#contact" class="inline-flex items-center gap-2 px-5 py-3 rounded-btn bg-lime hover:bg-lime-hover text-obsidian font-bold text-xs transition-all">
                    <span>${esc(t.schedule.bookSlotBtn)}</span>
                    <span>↗</span>
                  </a>
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function animateQuoteTotal() {
      const el = document.getElementById('quote-total-number');
      if (!el) return;
      const target = Number(el.dataset.value || 0);
      const previous = Number(window.__studioDwQuoteTotal);
      if (!Number.isFinite(previous) || previous === target) {
        window.__studioDwQuoteTotal = target;
        return;
      }
      const start = performance.now();
      const duration = 420;
      const from = previous;
      const tick = now => {
        const p = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = new Intl.NumberFormat('ko-KR').format(Math.round(from + (target - from) * eased));
        if (p < 1) requestAnimationFrame(tick);
        else window.__studioDwQuoteTotal = target;
      };
      requestAnimationFrame(tick);
    }

    function bindDynamicEvents() {
      animateQuoteTotal();
      const thumbOpen = document.getElementById('thumbnail-lightbox-open');
      const thumbBox = document.getElementById('thumbnail-lightbox');
      const thumbClose = document.getElementById('thumbnail-lightbox-close');
      if (thumbOpen && thumbBox) thumbOpen.addEventListener('click', () => { thumbBox.classList.remove('hidden'); thumbBox.classList.add('flex'); });
      if (thumbClose && thumbBox) thumbClose.addEventListener('click', () => { thumbBox.classList.add('hidden'); thumbBox.classList.remove('flex'); });
      if (thumbBox) thumbBox.addEventListener('click', e => { if (e.target === thumbBox) { thumbBox.classList.add('hidden'); thumbBox.classList.remove('flex'); } });
      const counter = document.querySelector('[data-count-up]');
      if (counter && !counter.dataset.started) {
        counter.dataset.started = '1';
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const runCounter = () => {
          if (reduced) { counter.textContent = '370'; return; }
          const start = performance.now(), duration = 1500;
          const tick = now => { const p = Math.min(1, (now-start)/duration); const eased = 1-Math.pow(1-p,3); counter.textContent = String(Math.round(100+270*eased)); if(p<1) requestAnimationFrame(tick); };
          requestAnimationFrame(tick);
        };
        if ('IntersectionObserver' in window) { const io = new IntersectionObserver(entries => { if(entries.some(e=>e.isIntersecting)){runCounter();io.disconnect();} }); io.observe(counter); } else runCounter();
      }
      const rerenderQuoteInPlace = () => {
        const y = window.scrollY;
        render();
        window.scrollTo({ top: y, left: 0, behavior: 'instant' });
      };
      document.querySelectorAll('[data-package]').forEach(btn => btn.addEventListener('click', () => {
        state.quote.package = btn.dataset.package; rerenderQuoteInPlace();
      }));
      const vocalistInput = document.getElementById('quote-vocalists');
      if (vocalistInput) {
        vocalistInput.addEventListener('click', () => vocalistInput.select());
        vocalistInput.addEventListener('change', () => { state.quote.vocalists = Math.max(1, Math.min(20, Math.round(Number(vocalistInput.value) || 1))); rerenderQuoteInPlace(); });
        vocalistInput.addEventListener('wheel', e => { e.preventDefault(); state.quote.vocalists = Math.max(1, Math.min(20, state.quote.vocalists + (e.deltaY < 0 ? 1 : -1))); rerenderQuoteInPlace(); }, { passive: false });
      }
      const durationInput = document.getElementById('quote-duration');
      if (durationInput) {
        durationInput.addEventListener('change', () => { state.quote.duration = Math.max(30, Math.min(480, Number(durationInput.value) || 210)); rerenderQuoteInPlace(); });
        durationInput.addEventListener('wheel', e => { e.preventDefault(); state.quote.duration = Math.max(30, Math.min(480, state.quote.duration + (e.deltaY < 0 ? 30 : -30))); rerenderQuoteInPlace(); }, { passive: false });
      }
      document.querySelectorAll('[data-background-toggle]').forEach(el => el.addEventListener('change', () => { state.quote.background = el.checked ? el.dataset.backgroundToggle : ''; rerenderQuoteInPlace(); }));
      document.querySelectorAll('[data-quote-check]').forEach(el => el.addEventListener('change', () => { state.quote[el.dataset.quoteCheck] = el.checked; if (el.dataset.quoteCheck === 'rush' && !state.quote.rush) state.quote.rushMultiplier = 1.5; rerenderQuoteInPlace(); }));
      const rushMultiplierInput = document.getElementById('quote-rush-multiplier');
      if (rushMultiplierInput) rushMultiplierInput.addEventListener('change', () => { state.quote.rushMultiplier = Number(rushMultiplierInput.value) === 2 ? 2 : 1.5; rerenderQuoteInPlace(); });
      const transferQuote = document.getElementById('quote-to-contact');
      if (transferQuote) transferQuote.addEventListener('click', () => {
        const result = quoteBreakdown(), q = state.quote;
        const labels = state.lang === 'ko'
          ? { package:'제작 타입', duration:'영상 길이', vocalists:'보컬 인원', background:'배경', additional:'추가 옵션', license:'수익 창출 라이선스', rush:'빠른 마감', estimate:'예상 금액', none:'없음', yes:'예', no:'아니오', requested:'요청함 (배율 상담 필요)', final:'최종 견적 필요' }
          : state.lang === 'ja'
            ? { package:'制作プラン', duration:'動画尺', vocalists:'ボーカル人数', background:'背景', additional:'追加制作オプション', license:'収益化ライセンス', rush:'特急納品', estimate:'概算金額', none:'なし', yes:'はい', no:'いいえ', requested:'希望あり（倍率は要相談）', final:'最終見積りが必要' }
            : { package:'Production tier', duration:'Video duration', vocalists:'Vocalists', background:'Background', additional:'Additional options', license:'Commercial license', rush:'Rush', estimate:'Estimated price', none:'None', yes:'Yes', no:'No', requested:'Requested (multiplier to be confirmed)', final:'final quote required' };
        const backgroundLabel = q.background === '2d' ? '2D' : q.background === '3d' ? '3D' : q.background === 'ue5' ? 'UE5' : labels.none;
        const additionalLabels = [q.live2d?'Live2D':'',q.thumbnailLogo?'Thumbnail + Logo':'',q.shorts?'Shorts / SNS':''].filter(Boolean).join(', ') || labels.none;
        state.quoteSummary = [
          `${labels.package}: ${q.package}`,
          `${labels.duration}: ${Math.floor(q.duration/60)}m ${String(q.duration%60).padStart(2,'0')}s`,
          `${labels.vocalists}: ${q.vocalists}`,
          `${labels.background}: ${backgroundLabel}`,
          `${labels.additional}: ${additionalLabels}`,
          `${labels.license}: ${q.commercial ? labels.yes : labels.no}`,
          `${labels.rush}: ${q.rush ? labels.requested : labels.no}`,
          `${labels.estimate}: ${money(result.total)}${result.needsQuote ? ` (${labels.final})` : ''}`
        ].join('\n');
        window.location.hash = '#contact';
      });
      const demoOpen = document.getElementById('admin-demo-open');
      if (demoOpen) demoOpen.addEventListener('click', () => { state.adminAuthed = true; render(); });
      const worksSearch = document.getElementById('works-search');
      if (worksSearch) worksSearch.addEventListener('input', () => {
        const pos = worksSearch.selectionStart;
        state.portfolioSearch = worksSearch.value;
        const list = document.getElementById('works-results');
        // Re-render results only to preserve input focus.
        const q = state.portfolioSearch.trim().toLocaleLowerCase();
        const filtered = sortByUpload(state.data.portfolios.filter(p => (state.portfolioFilter === 'ALL' || p.category === state.portfolioFilter) && (!q || String(p.title?.[state.lang] || '').toLocaleLowerCase().includes(q))));
        const target = document.getElementById('works-results');
        if (target) target.innerHTML = filtered.length ? filtered.map((item, idx) => renderPortfolioCard(item, idx)).join('') : `<p class="col-span-full py-16 text-center text-sm text-muted">${state.lang === 'ko' ? '검색 결과가 없습니다.' : state.lang === 'ja' ? '検索結果がありません。' : 'No results found.'}</p>`;
      });
      document.querySelectorAll('[data-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.portfolioFilter = btn.dataset.filter;
          render();
        });
      });

      document.querySelectorAll('[data-wf-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.workflowFilter = btn.dataset.wfFilter;
          render();
        });
      });

      const prevBtn = document.getElementById('cal-prev-month');
      if (prevBtn) {
        prevBtn.addEventListener('click', () => {
          if (state.selectedMonth === 1) {
            state.selectedMonth = 12;
            state.selectedYear -= 1;
          } else {
            state.selectedMonth -= 1;
          }
          state.selectedDateStr = null;
          render();
        });
      }

      const nextBtn = document.getElementById('cal-next-month');
      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
          if (state.selectedMonth === 12) {
            state.selectedMonth = 1;
            state.selectedYear += 1;
          } else {
            state.selectedMonth += 1;
          }
          state.selectedDateStr = null;
          render();
        });
      }

      const clearDateBtn = document.getElementById('cal-clear-date');
      if (clearDateBtn) {
        clearDateBtn.addEventListener('click', () => {
          state.selectedDateStr = null;
          render();
        });
      }

      document.querySelectorAll('[data-thumbnail-preview]').forEach(btn => {
        btn.addEventListener('click', event => {
          event.preventDefault();
          const modal = document.getElementById('thumbnail-preview-modal');
          const image = document.getElementById('thumbnail-preview-image');
          const src = btn.dataset.previewSrc;
          if (!modal || !image || !src) return;
          image.src = src;
          modal.classList.remove('hidden');
          modal.classList.add('flex');
        });
      });
      const closeThumbnailPreview = () => {
        const modal = document.getElementById('thumbnail-preview-modal');
        const image = document.getElementById('thumbnail-preview-image');
        if (!modal) return;
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        if (image) image.src = '';
      };
      document.getElementById('thumbnail-preview-close')?.addEventListener('click', closeThumbnailPreview);
      document.getElementById('thumbnail-preview-modal')?.addEventListener('click', event => {
        if (event.target.id === 'thumbnail-preview-modal') closeThumbnailPreview();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeThumbnailPreview();
      });

      document.querySelectorAll('[data-cal-day]').forEach(btn => {
        btn.addEventListener('click', () => {
          const clicked = btn.dataset.calDay;
          state.selectedDateStr = state.selectedDateStr === clicked ? null : clicked;
          render();
        });
      });

      const contactForm = document.getElementById('contact-form');
      if (contactForm) {
        contactForm.addEventListener('submit', e => {
          e.preventDefault();
          const t = I18N[state.lang];
          const fd = new FormData(contactForm);
          if (fd.get('company_website')) return;

          const name = (fd.get('name') || '').toString().trim();
          const channel = (fd.get('channel') || '').toString().trim();
          const email = (fd.get('email') || '').toString().trim();
          const subject = (fd.get('subject') || '').toString().trim();
          const message = (fd.get('message') || '').toString().trim();

          const errs = {
            name: !name ? t.contact.errors.name : '',
            channel: !channel ? (state.lang === 'ko' ? '업로드 채널을 입력해 주세요.' : state.lang === 'ja' ? 'チャンネルを入力してください。' : 'Please enter your upload channel.') : '',
            email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? t.contact.errors.email : '',
            subject: !subject ? t.contact.errors.subject : '',
            message: message.length < 10 ? t.contact.errors.message : '',
            agree: !fd.get('agree') ? t.contact.errors.agree : ''
          };

          let hasError = false;
          ['name', 'channel', 'email', 'subject', 'message', 'agree'].forEach(field => {
            const el = document.getElementById(`err-${field}`);
            if (errs[field]) {
              el.textContent = errs[field];
              el.classList.remove('hidden');
              hasError = true;
            } else {
              el.classList.add('hidden');
            }
          });

          if (hasError) return;

          const submitBtn = document.getElementById('c-submit-btn');
          submitBtn.disabled = true;
          submitBtn.innerHTML = `<span>${esc(t.contact.form.submitting)}</span>`;

          const f = t.contact.form;
          const subtitleLabels = { ko: f.korean, ja: f.japanese, en: f.english };
          const channelLabel = state.lang === 'ko' ? '업로드 채널' : state.lang === 'ja' ? 'アップロードチャンネル' : 'Upload Channel';
          const formText = [
            `[${f.name}] ${name}`,
            `[${channelLabel}] ${channel}`,
            `[${f.email}] ${email}`,
            `[${f.phone}] ${(fd.get('phone') || '').toString().trim()}`,
            `[${f.typeLabel}] ${subject === 'consultation' ? f.consultOption : subject}`,
            `[${f.subtitleLabel}] ${subtitleLabels[fd.get('subtitle_language')] || ''}`,
            `[${f.message}]\n${message}`
          ].join('\n');

          copyTextToClipboard(formText).then(ok => {
            if (!ok) throw new Error('copy failed');
            showToast(t.contact.form.successTitle);
            showContactSuccessModal();
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>${esc(t.contact.form.submit)}</span>`;
          }).catch(() => {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>' + esc(t.contact.form.submit) + '</span>';
            showToast(t.contact.form.failed);
          });
        });
      }

      document.querySelectorAll('[data-admin-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.adminTab = btn.dataset.adminTab;
          state.editingItem = null;
          render();
        });
      });

      const heroBgForm = document.getElementById('hero-bg-form');
      if (heroBgForm) {
        heroBgForm.addEventListener('submit', e => {
          e.preventDefault();
          const fd = new FormData(heroBgForm);
          state.data.heroBgVideoUrl = fd.get('heroBgVideoUrl').toString().trim();
          saveCMSData();
          showToast('Hero background reel updated.');
          render();
        });
      }

      // YouTube oEmbed로 제목/채널명/채널 링크를 불러와 비어 있거나 임시(번호) 제목인 항목에만 채웁니다.
      const ytSyncBtn = document.getElementById('admin-yt-sync-btn');
      if (ytSyncBtn) {
        ytSyncBtn.addEventListener('click', async () => {
          const isPlaceholder = s => !s || /(포트폴리오|ポートフォリオ|Portfolio)\s*\d{2}/.test(String(s)) || /Demo Portfolio/.test(String(s));
          const targets = state.data.portfolios.filter(p => p.youtubeId);
          const label = ytSyncBtn.querySelector('span');
          let ok = 0, fail = 0;
          ytSyncBtn.disabled = true;
          for (let i = 0; i < targets.length; i++) {
            const p = targets[i];
            if (label) label.textContent = `불러오는 중… ${i + 1}/${targets.length}`;
            try {
              const res = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + p.youtubeId));
              if (!res.ok) throw new Error(res.status);
              const info = await res.json();
              p.title = p.title || { ko: '', ja: '', en: '' };
              ['ko', 'ja', 'en'].forEach(l => { if (isPlaceholder(p.title[l])) p.title[l] = info.title; });
              if (!p.clientName) p.clientName = info.author_name || '';
              if (!p.clientPlatformUrl) p.clientPlatformUrl = info.author_url || '';
              if (!p.clientPlatform) p.clientPlatform = '채널 바로가기';
              p.ytOriginalTitle = info.title;
              ok++;
            } catch (e) { fail++; }
          }
          saveCMSData();
          showToast(`YouTube 정보 ${ok}건 불러옴${fail ? ` / ${fail}건 실패` : ''}`);
          render();
        });
      }

      // 번역 요청용: "순번 | 영상ID | 제목 | 채널명" 형식으로 클립보드에 복사합니다.
      const ytCopyBtn = document.getElementById('admin-yt-copy-btn');
      if (ytCopyBtn) {
        ytCopyBtn.addEventListener('click', async () => {
          const rows = sortByUpload(state.data.portfolios).filter(p => p.youtubeId).map(p =>
            [p.category, p.youtubeId, p.ytOriginalTitle || p.title?.ko || '', p.clientName || ''].join(' | '));
          try { await navigator.clipboard.writeText(rows.join('\n')); showToast(`${rows.length}건 복사됨`); }
          catch (e) { window.prompt('아래 내용을 복사하세요', rows.join('\n')); }
        });
      }

      const addBtn = document.getElementById('admin-add-btn');
      if (addBtn) {
        addBtn.addEventListener('click', () => {
          const todayDot = new Date().toISOString().slice(0, 10).replace(/-/g, '.');
          const todayDash = '2026-12-10';
          state.editingItem = {
            isNew: true,
            id: `${state.adminTab}-${Date.now()}`,
            date: state.adminTab === 'calendar' ? todayDash : todayDot,
            endDate: todayDash,
            status: 'open',
            category: state.adminTab === 'workflow' ? 'Add-on Options' : 'Standard',
            tools: 'Standard · Premium · Signature',
            badge: 'NOTICE',
            projectType: state.adminTab === 'review' ? 'REVIEW' : 'TERMS',
            client: state.adminTab === 'review' ? { ko: '', ja: '', en: '' } : '50,000 ~ KRW',
            role: '무컨펌 · 간단한 카메라 · 별도 연출 #0~1',
            videoUrl: state.adminTab === 'portfolio' ? 'https://www.youtube.com/watch?v=m9jXO6A1gNc' : '',
            accentHue: '82',
            title: { ko: '', ja: '', en: '' },
            summary: { ko: '', ja: '', en: '' },
            desc: { ko: '', ja: '', en: '' },
            note: { ko: '', ja: '', en: '' },
            body: { ko: '', ja: '', en: '' }
          };
          render();
        });
      }

      document.querySelectorAll('[data-admin-edit]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.adminEdit;
          const list = state.adminTab === 'portfolio'
            ? state.data.portfolios
            : state.adminTab === 'workflow'
              ? state.data.workflows
              : state.adminTab === 'calendar'
                ? state.data.calendarEvents
                : state.adminTab === 'notice'
                  ? state.data.notices
                  : state.data.reviews;
          const found = list.find(x => x.id === id);
          if (found) {
            state.editingItem = JSON.parse(JSON.stringify(found));
            render();
          }
        });
      });

      document.querySelectorAll('[data-admin-delete]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.adminDelete;
          if (state.adminTab === 'portfolio') state.data.portfolios = state.data.portfolios.filter(x => x.id !== id);
          else if (state.adminTab === 'workflow') state.data.workflows = state.data.workflows.filter(x => x.id !== id);
          else if (state.adminTab === 'calendar') state.data.calendarEvents = state.data.calendarEvents.filter(x => x.id !== id);
          else if (state.adminTab === 'notice') state.data.notices = state.data.notices.filter(x => x.id !== id);
          else state.data.reviews = state.data.reviews.filter(x => x.id !== id);
          saveCMSData();
          showToast('Deleted from CMS.');
          render();
        });
      });

      const cancelBtn = document.getElementById('admin-cancel-btn');
      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          state.editingItem = null;
          render();
        });
      }

      const resetDemoBtn = document.getElementById('admin-reset-btn');
      if (resetDemoBtn) {
        resetDemoBtn.addEventListener('click', () => {
          state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
          state.editingItem = null;
          saveCMSData();
          showToast('Sample data restored.');
          render();
        });
      }

      const editorForm = document.getElementById('admin-editor-form');
      if (editorForm) {
        editorForm.addEventListener('submit', e => {
          e.preventDefault();
          const fd = new FormData(editorForm);
          const tab = state.adminTab;
          const tKo = fd.get('titleKo').toString().trim();
          const tJa = fd.get('titleJa').toString().trim() || tKo;
          const tEn = fd.get('titleEn').toString().trim() || tKo;
          const bKo = fd.get('bodyKo').toString().trim();
          const bJa = fd.get('bodyJa').toString().trim() || bKo;
          const bEn = fd.get('bodyEn').toString().trim() || bKo;

          const updated = {
            ...state.editingItem,
            date: fd.get('date').toString().trim(),
            title: { ko: tKo, ja: tJa, en: tEn }
          };
          delete updated.isNew;

          if (tab === 'portfolio') {
            updated.category = fd.get('category').toString();
            updated.client = fd.get('client').toString().trim();
            updated.role = fd.get('role').toString().trim();
            updated.videoUrl = fd.get('videoUrl').toString().trim();
            updated.youtubeId = /^[A-Za-z0-9_-]{11}$/.test(updated.videoUrl) ? updated.videoUrl : (parseVideoEmbed(updated.videoUrl)?.id || '');
            updated.thumbnail = (fd.get('thumbnail') || '').toString().trim();
            updated.clientPlatformUrl = (fd.get('clientPlatformUrl') || '').toString().trim();
            updated.clientPlatform = (fd.get('clientPlatform') || '채널 바로가기').toString().trim();
            updated.clientReview = (fd.get('clientReview') || '').toString().trim();
            updated.clientName = (fd.get('clientName') || '').toString().trim();
            updated.productionNotes = (fd.get('productionNotes') || '').toString().trim();
            updated.desc = { ko: bKo, ja: bJa, en: bEn };
            const idx = state.data.portfolios.findIndex(x => x.id === updated.id);
            if (idx >= 0) state.data.portfolios[idx] = updated;
            else state.data.portfolios.unshift(updated);
          } else if (tab === 'workflow') {
            updated.category = fd.get('category').toString();
            updated.tools = fd.get('tools').toString().trim();
            updated.videoUrl = fd.get('videoUrl').toString().trim();
            updated.summary = { ko: bKo.slice(0, 120), ja: bJa.slice(0, 120), en: bEn.slice(0, 120) };
            updated.body = { ko: bKo, ja: bJa, en: bEn };
            const idx = state.data.workflows.findIndex(x => x.id === updated.id);
            if (idx >= 0) state.data.workflows[idx] = updated;
            else state.data.workflows.unshift(updated);
          } else if (tab === 'calendar') {
            updated.endDate = fd.get('endDate').toString().trim() || updated.date;
            updated.status = fd.get('status').toString();
            updated.note = { ko: bKo, ja: bJa, en: bEn };
            const idx = state.data.calendarEvents.findIndex(x => x.id === updated.id);
            if (idx >= 0) state.data.calendarEvents[idx] = updated;
            else state.data.calendarEvents.unshift(updated);
          } else if (tab === 'notice') {
            updated.badge = fd.get('badge').toString().trim() || 'NOTICE';
            updated.body = { ko: bKo, ja: bJa, en: bEn };
            const idx = state.data.notices.findIndex(x => x.id === updated.id);
            if (idx >= 0) state.data.notices[idx] = updated;
            else state.data.notices.unshift(updated);
          } else {
            updated.projectType = fd.get('projectType').toString().trim() || 'REVIEW';
            const cName = fd.get('clientKo').toString().trim() || '익명 고객';
            updated.client = { ko: cName, ja: cName, en: cName };
            updated.published = fd.get('published') === 'true';
            updated.body = { ko: bKo, ja: bJa, en: bEn };
            const idx = state.data.reviews.findIndex(x => x.id === updated.id);
            if (idx >= 0) state.data.reviews[idx] = updated;
            else state.data.reviews.unshift(updated);
          }

          state.editingItem = null;
          saveCMSData();
          showToast('Saved (preview: stored in this browser only).');
          render();
        });
      }
    }

    document.querySelectorAll('#lang-switcher button').forEach(btn => {
      btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
    });

    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileNav = document.getElementById('mobile-nav');
    mobileMenuBtn.addEventListener('click', () => {
      const isHidden = mobileNav.classList.toggle('hidden');
      mobileMenuBtn.setAttribute('aria-expanded', String(!isHidden));
      document.getElementById('menu-icon-open').classList.toggle('hidden', !isHidden);
      document.getElementById('menu-icon-close').classList.toggle('hidden', isHidden);
    });

    window.addEventListener('hashchange', () => {
      mobileNav.classList.add('hidden');
      document.getElementById('menu-icon-open').classList.remove('hidden');
      document.getElementById('menu-icon-close').classList.add('hidden');
      parseHash();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
      document.getElementById('app').focus({ preventScroll: true });
    });

    // Theme preference is explicitly controlled by the visitor and persisted locally.
    const themeButton = document.getElementById('theme-toggle');
    function updateThemeToggleLabel() {
      const label = document.getElementById('theme-toggle-label');
      if (!label) return;
      const light = document.body.classList.contains('light-theme');
      const themeLabels = { ko: ['다크모드','화이트모드'], ja: ['ダークモード','ホワイトモード'], en: ['Dark mode','Light mode'] };
      label.textContent = (themeLabels[state.lang] || themeLabels.ko)[light ? 0 : 1];
    }
    function applyTheme(theme) {
      const light = theme === 'light';
      document.documentElement.classList.toggle('light-theme', light);
      document.body.classList.toggle('light-theme', light);
      document.documentElement.classList.toggle('dark', !light);
      document.documentElement.style.colorScheme = light ? 'light' : 'dark';
      themeButton.setAttribute('aria-pressed', String(light));
      document.getElementById('theme-toggle-icon').textContent = light ? '☾' : '☼';
      updateThemeToggleLabel();
      document.querySelector('meta[name="theme-color"]').content = light ? '#f5f5f0' : '#080808';
      try { localStorage.setItem('studio-dw-theme', theme); } catch(e) {}
    }
    let savedTheme = 'dark';
    try { savedTheme = localStorage.getItem('studio-dw-theme') || 'dark'; } catch(e) {}
    applyTheme(savedTheme);
    themeButton.addEventListener('click', () => applyTheme(document.body.classList.contains('light-theme') ? 'dark' : 'light'));
    document.getElementById('back-to-top').addEventListener('click', () => window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
    initLanguageByIPSimulation();
    parseHash();
    render();
  </script>
<script>
(function(){
 const map={'Package':'제작 타입','Video duration':'영상 길이','Vocalists':'보컬 인원','Background':'배경','Additional options':'추가 옵션','Commercial license':'수익 창출 라이선스','Rush':'빠른 마감','Estimated price':'예상 금액'};
 function fix(root){if(!root)return; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const a=[]; while(w.nextNode())a.push(w.currentNode); a.forEach(n=>{let t=n.nodeValue; Object.keys(map).forEach(k=>{t=t.replace(new RegExp('(^|\\n)\\s*'+k.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\s*:', 'gm'), '$1'+map[k]+':');}); n.nodeValue=t;});}
 const o=new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)fix(n);}))); o.observe(document.body,{childList:true,subtree:true}); document.addEventListener('DOMContentLoaded',()=>fix(document.body));
})();
</script>

      <img id="thumbnail-preview-image" src="" alt="Thumbnail preview" class="max-w-full max-h-full object-contain shadow-2xl" />
